<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 3D Storytelling Map</title>
    <!-- MapLibre GL JS のライブラリ読み込み [1] -->
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .story-overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            font-family: sans-serif;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 300px;
            z-index: 1;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div class="story-overlay">
    <h2 id="title">World Cup Tour</h2>
    <p id="description">地図をロード中...</p>
</div>

<script>
    // 10シーンの定義 (ワールドカップの名スタジアム)
    const scenes = [
        { center: [-43.2302, -22.9121], zoom: 16, pitch: 60, bearing: 0, title: "マラカナン・スタジアム", desc: "ブラジル・リオデジャネイロ。数々の歴史的決勝戦が行われた聖地。" },
        { center: [139.6062, 35.5101], zoom: 16, pitch: 55, bearing: -20, title: "日産スタジアム", desc: "2002年決勝。日本で開催された決勝戦の舞台。" },
        { center: [126.6911, 37.4785], zoom: 16, pitch: 60, bearing: 45, title: "仁川文鶴競技場", desc: "2002年大会。韓国の名勝負が刻まれたスタジアム。" },
        { center: [37.5528, 55.7158], zoom: 16, pitch: 65, bearing: 10, title: "ルジニキ・スタジアム", desc: "2018年ロシア大会決勝の舞台。" },
        { center: [51.4883, 25.4211], zoom: 16, pitch: 60, bearing: -30, title: "ルサイル・アイコニック", desc: "2022年カタール大会。メッシが悲願の優勝を果たした場所。" },
        { center: [2.3646, 48.9244], zoom: 16, pitch: 50, bearing: 180, title: "スタッド・ド・フランス", desc: "1998年、ジダンがフランスを初優勝へ導いたスタジアム。" },
        { center: [13.3885, 52.5147], zoom: 16, pitch: 60, bearing: 90, title: "ベルリン・オリンピア", desc: "2006年ドイツ大会決勝。イタリアがPK戦を制した場所。" },
        { center: [-58.4501, -34.5453], zoom: 16, pitch: 60, bearing: 0, title: "エル・モヌメンタル", desc: "1978年、アルゼンチンが地元初優勝を決めた熱狂の地。" },
        { center: [-99.1505, 19.3030], zoom: 16, pitch: 55, bearing: 120, title: "エスタディオ・アステカ", desc: "1970/1986。ペレとマラドーナ、二人の伝説が生まれた場所。" },
        { center: [18.4712, -33.9059], zoom: 16, pitch: 60, bearing: -45, title: "ケープタウン・スタジアム", desc: "2010年アフリカ初のW杯。ブブゼラの音が響き渡った場所。" }
    ];

    // MapLibre GL JS の初期化 [1]
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty', // OpenFreeMapのスタイル
        center: scenes.center,
        zoom: 2,
        pitch: 60, // 直下視禁止 [1]
        bearing: 0,
        antialias: true
    });

    let sceneIndex = 0;
    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false }); // ポップアップの自動化 [1]

    map.on('load', () => {
        // 3D建物の表示設定 (fill-extrusion レイヤー) [1, 2]
        map.addLayer({
            'id': '3d-buildings',
            'source': 'openmaptiles',
            'source-layer': 'building',
            'type': 'fill-extrusion',
            'minzoom': 15,
            'paint': {
                'fill-extrusion-color': '#aaa',
                'fill-extrusion-height': ['get', 'render_height'],
                'fill-extrusion-base': ['get', 'render_min_height'],
                'fill-extrusion-opacity': 0.8
            }
        });

        // ストーリーの開始
        runStory();
    });

    function runStory() {
        const scene = scenes[sceneIndex];
        
        // カメラの自動移動 (flyTo) [1, 2]
        map.flyTo({
            center: scene.center,
            zoom: scene.zoom,
            pitch: scene.pitch,
            bearing: scene.bearing,
            speed: 0.5,
            curve: 1.5,
            essential: true
        });

        // UIの更新
        document.getElementById('title').innerText = scene.title;
        document.getElementById('description').innerText = scene.desc;

        // ポップアップの自動表示 [1, 2]
        popup.setLngLat(scene.center)
             .setHTML(`<strong>${scene.title}</strong>`)
             .addTo(map);

        sceneIndex = (sceneIndex + 1) % scenes.length;

        // 次のシーンへのタイマー (10秒ごと)
        setTimeout(runStory, 10000);
    }
</script>
</body>
</html>
